name: Bygg Android-APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 1.0.${{ github.run_number }}
  APP_BUILD: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bygg webbappen
        run: |
          npm ci
          npm run build
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bygg APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee build.log || {
            grep -E "error:|e: |What went wrong" -A3 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          cp app/build/outputs/apk/debug/app-debug.apk "../usb-$APP_VERSION.apk"

      # Om bygget misslyckas sparas loggen i grenen build-log, så att felet kan läsas utan att logga in på GitHub.
      - name: Spara byggloggen vid fel
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp android/build.log /tmp/build.log 2>/dev/null || echo "Ingen build.log – felet kom före Gradle." > /tmp/build.log
          git checkout --orphan build-log
          git rm -rfq .
          cp /tmp/build.log build.log
          git add build.log
          git commit -qm "Bygglogg för $APP_VERSION (misslyckades)"
          git push -f origin build-log

      - uses: actions/upload-artifact@v4
        with:
          name: usb-${{ env.APP_VERSION }}
          path: usb-${{ env.APP_VERSION }}.apk

      - name: Skriv versionens ändringar (CHANGELOG.md)
        run: python3 .github/scripts/changelog.py prepare "$APP_VERSION" "$(date +%Y-%m-%d)"

      - name: Lägg APK-filen och ändringarna i repot
        run: |
          # Bara den senaste versionen ligger i mappen apk/ (äldre finns under Releases).
          git rm -q --ignore-unmatch apk/*.apk
          mkdir -p apk
          cp "usb-$APP_VERSION.apk" apk/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk CHANGELOG.md
          git diff --cached --quiet || (git commit -m "Version $APP_VERSION: APK och ändringar [skip ci]" && git push)

      - name: Publicera som release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: USB ${{ env.APP_VERSION }}
          body_path: release-notes.md
          files: usb-${{ env.APP_VERSION }}.apk
          make_latest: true

      - name: Uppdatera ändringar i tidigare releaser
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force
          python3 .github/scripts/changelog.py sync
